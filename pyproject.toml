[project]
name = "keydynamics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lorenzHeinrich", email = "lorenz.heinrich@student.kit.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "evdev>=2.0.0; sys_platform == 'linux'",
    "numpy>=2.5.4",
    "pynput>=1.8.2",
]

[project.scripts]
keydynamics = "keydynamics:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
